[project]
name = "bit_detection"
version = "0.1.0"
description = "Generates biased pseudo-random bit streams to test whether LLMs can detect non-randomness"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Royce Nogales", email = "roycen1@umbc.edu" },
    { name = "Sina Roomi", email = "sinar1@umbc.edu" },
]
requires-python = ">=3.13"
dependencies = [
    "bitarray>=3.8.1",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
bd = "bit_detection.main:start"
